<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<style>

body{
  margin:0;
  background:#0b0b0f;
  color:white;
  font-family:Arial, sans-serif;
}

header{
  text-align:center;
  padding:70px 20px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
}

header h1{
  font-size:48px;
  margin:0;
}

header p{
  font-size:18px;
  opacity:0.9;
}

.search-box{
  text-align:center;
  margin:25px 0;
}

.search-box input{
  width:85%;
  max-width:500px;
  padding:14px;
  border-radius:14px;
  border:none;
  outline:none;
  font-size:16px;
}

.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
  max-width:1100px;
  margin:auto;
}

.card{
  background:#1a1a1a;
  border-radius:18px;
  overflow:hidden;
  transition:0.3s;
  box-shadow:0 0 10px rgba(0,0,0,0.5);
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 10px 30px rgba(124,58,237,0.4);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h2{
  text-align:center;
  margin:10px 0;
  font-size:20px;
}

button{
  width:90%;
  margin:15px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.05);
}

footer{
  text-align:center;
  padding:25px;
  color:#777;
  margin-top:30px;
}

</style>

</head>

<body>

<header>
<h1>Yesuf Gaming</h1>
<p>Games Hub</p>
</header>

<div class="search-box">
  <input type="text" id="searchInput" onkeyup="searchGames()" placeholder="Search game...">
</div>

<section class="games">

<div class="card">
  <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/297190/capsule_616x353.jpg?t=1700734056">
  <h2>Grayland</h2>
  <a href="grayland.html">
    <button>View Details</button>
  </a>
</div>

</section>

<footer>
© 2026 YESUF Gaming
</footer>

<script>
function searchGames(){
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.getElementsByClassName("card");

  for(let i = 0; i < cards.length; i++){
    let title = cards[i].getElementsByTagName("h2")[0];

    if(title.innerText.toLowerCase().includes(input)){
      cards[i].style.display = "block";
    } else {
      cards[i].style.display = "none";
    }
  }
}
</script>

</body>
</html>
