<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0b0d12;
  color:white;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
  z-index:1000;
}

.logo{
  font-weight:bold;
  font-size:16px;
}

.subtitle{
  font-size:11px;
  opacity:0.7;
}

.search{
  padding:8px 10px;
  border:none;
  border-radius:8px;
  outline:none;
  width:160px;
}

/* ===== SECTIONS ===== */
.section{
  margin:16px;
  border-radius:16px;
  overflow:hidden;
}

/* HEADER IMAGE */
.section-header{
  height:150px;
  display:flex;
  align-items:flex-end;
  padding:12px;
  font-size:20px;
  font-weight:bold;
  position:relative;
  background-size:cover;
  background-position:center;
}

.section-header::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
}

.section-header span{
  position:relative;
  z-index:1;
}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  padding:12px;
}

.card{
  background:#171a22;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
}

.card:hover{
  transform:translateY(-6px) scale(1.02);
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.card-title{
  font-size:14px;
  font-weight:bold;
}

.card-desc{
  font-size:12px;
  opacity:0.7;
  margin-top:4px;
}

/* hidden for search */
.hide{
  display:none;
}

/* mobile */
@media (max-width:600px){
  .search{
    width:110px;
  }

  .section-header{
    height:120px;
    font-size:18px;
  }
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <div>
    <div class="logo">🎮 Yesuf Gaming</div>
    <div class="subtitle">ألعاب PC + Android + محاكيات + ألعاب معرّبة</div>
  </div>

  <input class="search" id="search" placeholder="بحث عن لعبة...">
</header>

<!-- ===== ANDROID ===== -->
<div class="section">

  <div class="section-header"
  style="background-image:url('https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg')">
    <span>Android Games</span>
  </div>

  <div class="cards">

    <div class="card" data-name="zelda android action">
      <img src="https://via.placeholder.com/300x200">
      <div class="card-content">
        <div class="card-title">Zelda Mobile</div>
        <div class="card-desc">Action • Android</div>
      </div>
    </div>

    <div class="card" data-name="pubg mobile battle">
      <img src="https://via.placeholder.com/300x200">
      <div class="card-content">
        <div class="card-title">PUBG Mobile</div>
        <div class="card-desc">Battle Royale</div>
      </div>
    </div>

  </div>
</div>

<!-- ===== PC ===== -->
<div class="section">

  <div class="section-header"
  style="background-image:url('https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg')">
    <span>PC Games</span>
  </div>

  <div class="cards">

    <div class="card" data-name="gta v pc open world">
      <img src="https://via.placeholder.com/300x200">
      <div class="card-content">
        <div class="card-title">GTA V</div>
        <div class="card-desc">Open World • PC</div>
      </div>
    </div>

    <div class="card" data-name="far cry pc shooter">
      <img src="https://via.placeholder.com/300x200">
      <div class="card-content">
        <div class="card-title">Far Cry 5</div>
        <div class="card-desc">FPS • PC</div>
      </div>
    </div>

  </div>
</div>

<!-- ===== ROMS ===== -->
<div class="section">

  <div class="section-header"
  style="background-image:url('https://thumbs.dreamstime.com/b/assortiment-de-r%C3%A9tros-cartouches-syst%C3%A8mes-et-contr%C3%B4leurs-classiques-jeu-vid%C3%A9o-137215185.jpg')">
    <span>ROMS & Emulators</span>
  </div>

  <div class="cards">

    <div class="card" data-name="ps2 roms emulator retro">
      <img src="https://via.placeholder.com/300x200">
      <div class="card-content">
        <div class="card-title">PS2 ROMS</div>
        <div class="card-desc">Retro Gaming</div>
      </div>
    </div>

    <div class="card" data-name="gba emulator android">
      <img src="https://via.placeholder.com/300x200">
      <div class="card-content">
        <div class="card-title">GBA Emulator</div>
        <div class="card-desc">Classic Games</div>
      </div>
    </div>

  </div>
</div>

<!-- ===== SCRIPT SEARCH ===== -->
<script>
const search = document.getElementById("search");
const cards = document.querySelectorAll(".card");

search.addEventListener("input", () => {
  const value = search.value.toLowerCase();

  cards.forEach(card => {
    const name = card.getAttribute("data-name");

    if(name.includes(value)){
      card.classList.remove("hide");
    } else {
      card.classList.add("hide");
    }
  });
});
</script>

</body>
</html>
