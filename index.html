<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0b0d12;
  color:white;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
}

.logo{
  font-weight:bold;
  font-size:16px;
}

.subtitle{
  font-size:11px;
  opacity:0.7;
}

.search{
  padding:8px;
  border:none;
  border-radius:8px;
  outline:none;
  width:160px;
}

/* ===== TABS ===== */
.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:12px;
}

.tabs button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#1a1d24;
  color:white;
  transition:0.2s;
}

.tabs button:hover{
  background:#2a2f3a;
}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  padding:16px;
}

.card{
  background:#171a22;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
}

.card:hover{
  transform:translateY(-6px) scale(1.02);
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.card-title{
  font-size:14px;
  font-weight:bold;
}

.card-desc{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <div>
    <div class="logo">🎮 Yesuf Gaming</div>
    <div class="subtitle">PC + Android + ROMS</div>
  </div>

  <input class="search" placeholder="بحث...">
</header>

<!-- ===== TABS ===== -->
<div class="tabs">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('android')">Android</button>
  <button onclick="filter('pc')">PC</button>
  <button onclick="filter('roms')">ROMS</button>
</div>

<!-- ===== CARDS ===== -->
<div class="cards">

  <!-- ANDROID -->
  <div class="card" data-type="android">
    <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
    <div class="card-content">
      <div class="card-title">Android Games</div>
      <div class="card-desc">ألعاب أندرويد</div>
    </div>
  </div>

  <!-- PC -->
  <div class="card" data-type="pc">
    <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
    <div class="card-content">
      <div class="card-title">PC Games</div>
      <div class="card-desc">ألعاب الكمبيوتر</div>
    </div>
  </div>

  <!-- ROMS - Nintendo Switch -->
  <div class="card" data-type="roms">
    <img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
    <div class="card-content">
      <div class="card-title">Nintendo Switch</div>
      <div class="card-desc">ROMS • Emulator</div>
    </div>
  </div>

</div>

<!-- ===== SCRIPT ===== -->
<script>
function filter(type){

  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {

    if(type === "all"){
      card.style.display = "block";
    }
    else if(card.dataset.type === type){
      card.style.display = "block";
    }
    else{
      card.style.display = "none";
    }

  });

}
</script>

</body>
</html>
