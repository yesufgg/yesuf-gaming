<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    background:#0b1118;
    color:white;
}

header{
    text-align:center;
    padding:80px 20px;
    background:linear-gradient(to bottom,#141925,#0b1118);
}

header h1{
    font-size:50px;
    color:#7c3aed;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:30px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:#111827;
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.back-btn{
    margin:20px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    cursor:pointer;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<header>
<h1>🎮 Yesuf Gaming</h1>
</header>

<!-- 🔥 الصفحة الرئيسية -->
<section class="games" id="main">

<div class="card" onclick="showNES()">
<img src="https://cdn.shopify.com/s/files/1/0336/4824/6924/collections/1760169.png?v=1597423331">
<div class="card-content">
<h2>NES Games</h2>
</div>
</div>

</section>

<!-- 🎮 NES -->
<section id="nes" class="games hidden">

<button class="back-btn" onclick="goBack()">⬅ رجوع</button>

<!-- 🎮 Super Mario Bros -->
<div class="card" onclick="openMario()">
<img src="https://www.covercentury.com/covers/nes/s/nes_supermariobros.jpg">
<div class="card-content">
<h2>Super Mario Bros</h2>
<p>لعبة منصات كلاسيكية</p>
</div>
</div>

</section>

<script>

function showNES(){
    document.getElementById("main").style.display="none";
    document.getElementById("nes").style.display="grid";
}

function goBack(){
    document.getElementById("nes").style.display="none";
    document.getElementById("main").style.display="grid";
}

/* 🎮 فتح صفحة Mario */
function openMario(){
    window.location.href = "mario.html";
}

</script>

</body>
</html>
