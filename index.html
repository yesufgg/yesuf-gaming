<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #1a1f3a, #0b0d12 60%);
  color:white;
}

header{
  padding:16px;
  font-size:20px;
  text-align:center;
  font-weight:bold;
  background: linear-gradient(90deg,#5865f2,#7c4dff);
}

/* 🔥 كبرنا الكروت */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
  padding:18px;
}

.card{
  background:#141827;
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
  border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
  transform:translateY(-6px) scale(1.03);
  box-shadow:0 0 25px rgba(88,101,242,0.3);
}

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.card-content{
  padding:12px;
  font-size:14px;
  text-align:center;
}

.hide{
  display:none !important;
}

footer{
  margin-top:20px;
  padding:15px;
  text-align:center;
  font-size:12px;
  color:#aaa;
  border-top:1px solid rgba(255,255,255,0.08);
}
</style>
</head>

<body>

<header>🎮 Yesuf Gaming</header>

<!-- MAIN -->
<div class="cards" id="main">

  <div class="card">
    <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
    <div class="card-content">Android Games</div>
  </div>

  <div class="card">
    <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
    <div class="card-content">PC Games</div>
  </div>

  <div class="card" onclick="openRoms()">
    <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg">
    <div class="card-content">ROMS</div>
  </div>

</div>

<!-- ROMS -->
<div class="cards hide" id="roms">

  <div class="card" onclick="openNSW()">
    <img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
    <div class="card-content">Nintendo Switch (NSW)</div>
  </div>

</div>

<!-- NSW -->
<div class="cards hide" id="nsw">

  <div class="card">
    <img src="https://assets.nintendo.com/image/upload/c_limit,f_auto,h_300,q_auto,w_400/v1/Microsites/zelda-tears-of-the-kingdom/videos/posters/totk_microsite_officialtrailer2_fr">
    <div class="card-content">
      The Legend Of Zelda TOTK (معربة)
    </div>
  </div>

</div>

<footer>
  جميع الحقوق محفوظة © 2026 Yesuf Gaming
</footer>

<script>

function openRoms(){
  document.getElementById("main").classList.add("hide");
  document.getElementById("roms").classList.remove("hide");
  history.pushState({page:"roms"}, "");
}

function openNSW(){
  document.getElementById("roms").classList.add("hide");
  document.getElementById("nsw").classList.remove("hide");
  history.pushState({page:"nsw"}, "");
}

window.addEventListener("popstate", function(){
  document.getElementById("nsw").classList.add("hide");
  document.getElementById("roms").classList.add("hide");
  document.getElementById("main").classList.remove("hide");
});

</script>

</body>
</html>
