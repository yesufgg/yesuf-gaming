<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:'Cairo',sans-serif;
    background:#0b1118;
    color:white;
}

/* 🔥 الهيدر */
header{
    text-align:center;
    padding:70px 20px;
    background:linear-gradient(to bottom,#141925,#0b1118);
}

header h1{
    font-size:50px;
    color:#7c3aed;
}

/* 🎮 الكروت */
.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    padding:25px;
    max-width:1200px;
    margin:auto;
}

.card{
    background:#111827;
    border-radius:18px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

/* 🔙 زر الرجوع داخل الموقع (اختياري) */
.back-btn{
    margin:20px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    cursor:pointer;
}

.hidden{
    display:none;
}

/* 📱 تحسين الهاتف */
@media (max-width:768px){
    header h1{
        font-size:32px;
    }
}

</style>
</head>

<body>

<header>
<h1>🎮 Yesuf Gaming</h1>
</header>

<!-- 🔥 الصفحة الرئيسية -->
<section class="games" id="main">

<div class="card" onclick="showSection('android')">
<img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
<div class="card-content"><h2>Android</h2></div>
</div>

<div class="card" onclick="showSection('roms')">
<img src="https://media.sketchfab.com/models/266d26be2a6d47d58880bb723d1faf7a/thumbnails/67943311943141aab921e5f9a1916ae4/53435a17ae3242e9b07b89c417472d88.jpeg">
<div class="card-content"><h2>ROMS</h2></div>
</div>

</section>

<!-- 🎮 Android -->
<section id="android" class="games hidden">

<button class="back-btn" onclick="goBack()">⬅ رجوع</button>

<div class="card" onclick="openGrayland()">
<img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/297190/capsule_616x353.jpg">
<div class="card-content">
<h2>Grayland</h2>
</div>
</div>

</section>

<!-- 🎮 ROMS -->
<section id="roms" class="games hidden">

<button class="back-btn" onclick="goBack()">⬅ رجوع</button>

<div class="card" onclick="showNES()">
<img src="https://cdn.shopify.com/s/files/1/0336/4824/6924/collections/1760169.png?v=1597423331">
<div class="card-content"><h2>NES</h2></div>
</div>

<div class="card">
<img src="https://bitjumpgames.com/cdn/shop/files/snes_logo.png?v=1736747784&width=460">
<div class="card-content"><h2>SNES</h2></div>
</div>

<div class="card">
<img src="https://pbs.twimg.com/media/F4OTmp9XgAAB0lj.jpg">
<div class="card-content"><h2>PSP</h2></div>
</div>

</section>

<!-- 🎮 NES -->
<section id="nes" class="games hidden">

<button class="back-btn" onclick="goBack()">⬅ رجوع</button>

<div class="card" onclick="openMario()">
<img src="https://www.covercentury.com/covers/nes/s/nes_supermariobros.jpg">
<div class="card-content">
<h2>Super Mario Bros</h2>
</div>
</div>

</section>

<script>

function showSection(id){

    document.getElementById("main").style.display="none";

    document.querySelectorAll(".hidden").forEach(s=>{
        s.style.display="none";
    });

    document.getElementById(id).style.display="grid";

    // 🔥 إضافة للسجل (زر الرجوع في الهاتف)
    history.pushState({page:id}, "", "#" + id);
}

/* 🔙 رجوع داخل الموقع */
function goBack(){
    document.querySelectorAll(".hidden").forEach(s=>{
        s.style.display="none";
    });
    document.getElementById("main").style.display="grid";
}

/* 🔥 دعم زر الرجوع في الهاتف */
window.addEventListener("popstate", function(event){

    document.querySelectorAll(".hidden").forEach(s=>{
        s.style.display="none";
    });

    if(event.state && event.state.page){
        document.getElementById(event.state.page).style.display="grid";
        document.getElementById("main").style.display="none";
    } else {
        document.getElementById("main").style.display="grid";
    }

});

/* 🎮 فتح الألعاب */
function openMario(){
    window.location.href = "mario.html";
}

function openGrayland(){
    window.location.href = "grayland.html";
}

</script>

</body>
</html>
