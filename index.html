<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>

body{
font-family:Arial;
background:#0b1220;
color:white;
margin:0;
}

.page{
display:none;
padding:20px;
}

.active{
display:block;
}

.card{
background:#111827;
padding:15px;
margin:10px 0;
border-radius:12px;
cursor:pointer;
}

img{
width:100%;
border-radius:10px;
margin-top:10px;
}

button{
padding:10px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
margin-bottom:10px;
cursor:pointer;
}

</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">

<div class="card" onclick="go('switch')">
<h2>🎮 ROMs</h2>
<img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg">
</div>

</div>

<!-- SWITCH -->
<div id="switch" class="page">

<button onclick="go('home')">⬅ رجوع</button>

<div class="card" onclick="go('zelda')">
<h2>🎮 Nintendo Switch</h2>
<img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
</div>

</div>

<!-- ZELDA -->
<div id="zelda" class="page">

<button onclick="go('switch')">⬅ رجوع</button>

<div class="card">

<h2>🗡️ Zelda TOTK</h2>

<p>
🌍 لعبة عالم مفتوح في Hyrule  
🧩 ألغاز + قتال + استكشاف
</p>

<img src="https://oaklandpostonline.com/wp-content/uploads/2023/07/Picture1.png">

<p>⬇ اللعبة: https://ouo.io/MZiezH</p>
<p>⬆ التحديث: https://ouo.io/xBRaCU</p>
<p>🈯 التعريب: MediaFire link</p>
<p>💻 Yuzu / 📱 Eden</p>

</div>

</div>

<script>

function go(id){

let pages = document.querySelectorAll(".page");

pages.forEach(p=>{
p.classList.remove("active");
});

document.getElementById(id).classList.add("active");

window.scrollTo(0,0);
}

</script>

</body>
</html>
