<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
}

header{
  text-align:center;
  padding:70px 20px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
}

header h1{
  font-size:60px;
  margin:0;
}

header p{
  font-size:20px;
}

.games{
  display:flex;
  justify-content:center;
  gap:25px;
  flex-wrap:wrap;
  padding:40px 20px;
}

.card{
  width:320px;
  background:#1a1a1a;
  border-radius:20px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card h2{
  text-align:center;
}

.card p{
  color:#bbb;
  padding:0 15px;
  line-height:1.7;
}

button{
  margin:20px;
  width:calc(100% - 40px);
  padding:14px;
  border:none;
  border-radius:12px;
  background:#7c3aed;
  color:white;
  font-size:16px;
  cursor:pointer;
}

footer{
  text-align:center;
  padding:30px;
  color:#888;
}

</style>

</head>
<body>

<header>
<h1>🎮 Yesuf Gaming</h1>
<p>أفضل ألعاب الأندرويد والبيسي والمحاكيات</p>
</header>

<section class="games">

<div class="card">

<img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/297190/capsule_616x353.jpg?t=1700734056">

<a href="grayland.html">
  <button>📖 عرض التفاصيل</button>
</a>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?q=80&w=1200&auto=format&fit=crop">

<h2>Zelda</h2>

<p>
مغامرة ملحمية في عالم مفتوح مليء بالأسرار والاستكشاف.
</p>

<button>تحميل اللعبة</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?q=80&w=1200&auto=format&fit=crop">

<h2>Shovel Knight</h2>

<p>
لعبة منصات كلاسيكية ممتعة بأسلوب بيكسل رائع.
</p>

<button>تحميل اللعبة</button>

</div>

</section>

<footer>
© 2026 YESUF Gaming
</footer>

</body>
</html>
