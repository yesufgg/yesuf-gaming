<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0b0d12;
color:white;
}

header{
background:linear-gradient(135deg,#5865f2,#7c4dff);
padding:25px;
text-align:center;
font-size:28px;
font-weight:bold;
box-shadow:0 4px 20px rgba(0,0,0,.4);
}

.hero{
padding:30px 20px;
text-align:center;
background:url('https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg') center/cover;
position:relative;
}

.hero::before{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.65);
}

.hero h2{
position:relative;
z-index:2;
font-size:32px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:25px;
}

.card{
background:#141827;
border-radius:18px;
overflow:hidden;
cursor:pointer;
transition:.25s;
border:1px solid rgba(255,255,255,.05);
}

.card:hover{
transform:translateY(-8px);
box-shadow:0 0 30px rgba(88,101,242,.35);
}

.card img{
width:100%;
height:170px;
object-fit:cover;
display:block;
}

.card-content{
padding:15px;
text-align:center;
font-size:16px;
font-weight:bold;
}

.hide{
display:none !important;
}

a{
text-decoration:none;
color:white;
}

footer{
margin-top:20px;
padding:18px;
text-align:center;
color:#aaa;
font-size:13px;
border-top:1px solid rgba(255,255,255,.08);
}
</style>
</head>
<body>

<header>🎮 Yesuf Gaming</header>

<div class="hero">
<h2>Welcome To Yesuf Gaming</h2>
</div>

<!-- الصفحة الرئيسية -->
<div class="cards" id="home">

<div class="card">
<img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
<div class="card-content">Android Games</div>
</div>

<div class="card">
<img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
<div class="card-content">PC Games</div>
</div>

<div class="card" onclick="openRoms()">
<img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg">
<div class="card-content">ROMS</div>
</div>

</div>

<!-- ROMS -->
<div class="cards hide" id="roms">

<div class="card" onclick="openNSW()">
<img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
<div class="card-content">Nintendo Switch (NSW)</div>
</div>

</div>

<!-- NSW -->
<div class="cards hide" id="nsw">

<a href="zelda.html">
<div class="card">
<img src="https://assets.nintendo.com/image/upload/c_limit,f_auto,h_300,q_auto,w_400/v1/Microsites/zelda-tears-of-the-kingdom/videos/posters/totk_microsite_officialtrailer2_fr">
<div class="card-content">
The Legend Of Zelda TOTK (معربة)
</div>
</div>
</a>

</div>

<footer>
جميع الحقوق محفوظة © 2026 Yesuf Gaming
</footer>

<script>

function openRoms(){
history.pushState({page:'roms'},'', '');

document.getElementById('home').classList.add('hide');
document.getElementById('roms').classList.remove('hide');
}

function openNSW(){
history.pushState({page:'nsw'},'', '');

document.getElementById('roms').classList.add('hide');
document.getElementById('nsw').classList.remove('hide');
}

window.addEventListener('popstate',()=>{

if(!document.getElementById('nsw').classList.contains('hide')){
document.getElementById('nsw').classList.add('hide');
document.getElementById('roms').classList.remove('hide');
return;
}

if(!document.getElementById('roms').classList.contains('hide')){
document.getElementById('roms').classList.add('hide');
document.getElementById('home').classList.remove('hide');
return;
}

});

</script>

</body>
</html>
