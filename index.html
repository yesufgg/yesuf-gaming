<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0b0d12;
  color:white;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
}

.logo{
  font-weight:bold;
}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  padding:16px;
}

.card{
  background:#171a22;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.card-title{
  font-weight:bold;
  font-size:14px;
}

/* ===== HIDE SYSTEM ===== */
.hide{
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎮 Yesuf Gaming</div>
</header>

<!-- ===== MAIN CARDS ===== -->
<div class="cards">

  <!-- ANDROID -->
  <div class="card" onclick="showOnly('android')">
    <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
    <div class="card-content">
      <div class="card-title">Android Games</div>
    </div>
  </div>

  <!-- PC -->
  <div class="card" onclick="showOnly('pc')">
    <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
    <div class="card-content">
      <div class="card-title">PC Games</div>
    </div>
  </div>

  <!-- ROMS (رجعت الصورة والاسم) -->
  <div class="card" onclick="showOnly('roms')">
    <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg?w=1600&h=900&fit=crop">
    <div class="card-content">
      <div class="card-title">ROMS</div>
    </div>
  </div>

</div>

<!-- ===== ROMS CONTENT ===== -->
<div class="cards">

  <!-- Nintendo Switch يظهر فقط عند الضغط على ROMS -->
  <div class="card hide roms">
    <img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
    <div class="card-content">
      <div class="card-title">Nintendo Switch (NSW)</div>
    </div>
  </div>

</div>

<!-- ===== SCRIPT ===== -->
<script>
function showOnly(type){

  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {

    // كرت ROMS الرئيسي لا يختفي
    if(card.onclick){
      return;
    }

    if(type === "roms"){
      if(card.classList.contains("roms")){
        card.classList.remove("hide");
      } else {
        card.classList.add("hide");
      }
    }

  });

}
</script>

</body>
</html>
