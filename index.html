<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0d12;
  color:white;
}

header{
  padding:16px;
  text-align:center;
  font-size:20px;
  background:linear-gradient(90deg,#5865f2,#7c4dff);
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  padding:15px;
}

.card{
  background:#141827;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
}

.card-content{
  padding:10px;
  text-align:center;
}

a{color:white;text-decoration:none;}

footer{
  text-align:center;
  padding:15px;
  font-size:12px;
  color:#aaa;
}
</style>
</head>

<body>

<header>🎮 Yesuf Gaming</header>

<div class="cards">

  <div class="card">
    <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
    <div class="card-content">Android Games</div>
  </div>

  <div class="card">
    <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
    <div class="card-content">PC Games</div>
  </div>

  <div class="card">
    <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg">
    <div class="card-content">ROMS</div>
  </div>

</div>

<div class="cards">

  <a href="zelda.html">
    <div class="card">
      <img src="https://assets.nintendo.com/image/upload/c_limit,f_auto,h_300,q_auto,w_400/v1/Microsites/zelda-tears-of-the-kingdom/videos/posters/totk_microsite_officialtrailer2_fr">
      <div class="card-content">The Legend Of Zelda TOTK (معربة)</div>
    </div>
  </a>

</div>

<footer>
  جميع الحقوق محفوظة © 2026 Yesuf Gaming
</footer>

</body>
</html>
