<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    background:#0b1118;
    color:white;
}

/* 🔥 الهيدر */
header{
    text-align:center;
    padding:90px 20px;
    background:linear-gradient(to bottom,#141925,#0b1118);
}

header h1{
    font-size:60px;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* 🎮 الفئات */
.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    padding:30px;
    max-width:1200px;
    margin:auto;
}

/* 🎴 كرت */
.card{
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

/* 🖼️ صورة */
.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

/* 📝 */
.card-content{
    padding:18px;
}

.game-btn{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);
    color:white;
    cursor:pointer;
}

/* 📂 إخفاء الأقسام */
.hidden{
    display:none;
}

.section-title{
    text-align:center;
    margin:25px 0;
    font-size:28px;
}

</style>
</head>

<body>

<header>
<h1>🎮 Yesuf Gaming</h1>
<p>أفضل مكتبة ألعاب للأندرويد والكمبيوتر والمحاكيات</p>
</header>

<!-- 🔥 الفئات الرئيسية -->
<section class="games" id="main">

<!-- Android -->
<div class="card" onclick="showSection('android')">
<img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
<div class="card-content">
<h2>Android</h2>
<button class="game-btn">دخول</button>
</div>
</div>

<!-- PC -->
<div class="card">
<img src="https://images.unsplash.com/photo-1542751110-97427bbecf20?q=80&w=1200">
<div class="card-content">
<h2>PC</h2>
<button class="game-btn">دخول</button>
</div>
</div>

<!-- ROMS -->
<div class="card" onclick="showSection('roms')">
<img src="https://media.sketchfab.com/models/266d26be2a6d47d58880bb723d1faf7a/thumbnails/67943311943141aab921e5f9a1916ae4/53435a17ae3242e9b07b89c417472d88.jpeg">
<div class="card-content">
<h2>ROMS</h2>
<button class="game-btn">دخول</button>
</div>
</div>

</section>

<!-- 🎮 Android Games -->
<section id="android" class="games hidden">

<div class="card">
<img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/297190/capsule_616x353.jpg">
<div class="card-content">
<h2>Grayland</h2>
<p>لعبة مغامرات وألغاز بأجواء مظلمة</p>
</div>
</div>

</section>

<!-- 🎮 ROMS DEVICES -->
<section id="roms" class="games hidden">

<!-- NES (1983) -->
<div class="card">
<img src="https://s2.dmcdn.net/v/3U4291epBEg7WFB8t/x1080">
<div class="card-content"><h2>NES</h2></div>
</div>

<!-- Sega Master System (1985) -->
<div class="card">
<img src="https://live.staticflickr.com/7753/29090801190_dc96280dfd_z.jpg">
<div class="card-content"><h2>Sega Master System</h2></div>
</div>

<!-- Sega Genesis (1988) -->
<div class="card">
<img src="https://static.wikia.nocookie.net/aaahhrealmonsters/images/a/ab/Sega-Genesis-Logo.jpg">
<div class="card-content"><h2>Sega Genesis</h2></div>
</div>

<!-- SNES (1990) -->
<div class="card">
<img src="https://vectorseek.com/wp-content/uploads/2023/10/super-nintendo-Logo-Vector.svg-.png">
<div class="card-content"><h2>SNES</h2></div>
</div>

<!-- PS1 (1994) -->
<div class="card">
<img src="https://4kwallpapers.com/images/wallpapers/playstation-logo-8k-3840x2160-14190.png">
<div class="card-content"><h2>PlayStation 1</h2></div>
</div>

<!-- N64 (1996) -->
<div class="card">
<img src="https://res.cloudinary.com/jerrick/image/upload/v1775590452/69d55c34213ac3001da17971.jpg">
<div class="card-content"><h2>Nintendo 64</h2></div>
</div>

<!-- GBA (2001) -->
<div class="card">
<img src="https://cdn2.steamgriddb.com/grid/458375c3383253b03634e8c476101be3.png">
<div class="card-content"><h2>Game Boy Advance</h2></div>
</div>

<!-- PSP (2004) -->
<div class="card">
<img src="https://cdn.wallpapersafari.com/86/32/zTf5DI.jpg">
<div class="card-content"><h2>PSP</h2></div>
</div>

</section>

<script>

function showSection(id){

    document.getElementById("main").style.display="none";

    document.querySelectorAll(".hidden").forEach(s=>{
        s.style.display="none";
    });

    document.getElementById(id).style.display="grid";

}

</script>

</body>
</html>
