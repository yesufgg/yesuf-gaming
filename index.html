<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0b0d12;
  color:white;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
}

.logo{
  font-weight:bold;
  font-size:16px;
}

.subtitle{
  font-size:11px;
  opacity:0.7;
}

.search{
  padding:8px;
  border:none;
  border-radius:8px;
  outline:none;
  width:160px;
}

/* ===== TABS ===== */
.tabs{
  display:flex;
  justify-content:center;
  gap:10px;
  margin:12px;
}

.tabs button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#1a1d24;
  color:white;
  transition:0.2s;
}

.tabs button:hover{
  background:#2a2f3a;
}

/* ===== SECTIONS ===== */
.section{
  display:none;
  padding:10px 16px;
}

.section.active{
  display:block;
}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
}

.card{
  background:#171a22;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
  min-height:120px;
}

.card:hover{
  transform:translateY(-5px);
}

.card-content{
  padding:10px;
}

.card-title{
  font-size:14px;
  font-weight:bold;
}

.card-desc{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <div>
    <div class="logo">🎮 Yesuf Gaming</div>
    <div class="subtitle">PC + Android + ROMS + محاكيات</div>
  </div>

  <input class="search" placeholder="بحث...">
</header>

<!-- ===== TABS ===== -->
<div class="tabs">
  <button onclick="show('android')">Android</button>
  <button onclick="show('pc')">PC</button>
  <button onclick="show('roms')">ROMS</button>
</div>

<!-- ===== ANDROID ===== -->
<div id="android" class="section active">
  <div class="cards">
    <!-- أضف كروتك هنا -->
  </div>
</div>

<!-- ===== PC ===== -->
<div id="pc" class="section">
  <div class="cards">
    <!-- أضف كروتك هنا -->
  </div>
</div>

<!-- ===== ROMS ===== -->
<div id="roms" class="section">
  <div class="cards">
    <!-- أضف كروتك هنا -->
  </div>
</div>

<!-- ===== JS ===== -->
<script>
function show(id){

  let sections = document.querySelectorAll(".section");

  sections.forEach(sec=>{
    sec.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
