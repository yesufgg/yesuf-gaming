<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    background:#0b1118;
    color:white;
}

/* 🔥 الهيدر */
header{
    text-align:center;
    padding:90px 20px;
    background:linear-gradient(to bottom,#141925,#0b1118);
}

header h1{
    font-size:60px;
    background:linear-gradient(90deg,#7c3aed,#06b6d4);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

header p{
    color:#a5b4c7;
}

/* 🎮 الفئات */
.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    padding:30px;
    max-width:1200px;
    margin:auto;
}

/* 🎴 الكرت */
.card{
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

/* 🖼️ الصور */
.card img{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
}

/* 📝 المحتوى */
.card-content{
    padding:18px;
}

/* 🔘 زر */
.game-btn{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);
    color:white;
    cursor:pointer;
}

/* 🔙 زر الرجوع */
.back-btn{
    margin:20px;
    padding:10px 15px;
    border:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    cursor:pointer;
}

.back-btn:hover{
    background:#374151;
}

/* 📂 إخفاء الأقسام */
.hidden{
    display:none;
}

</style>
</head>

<body>

<header>
<h1>🎮 Yesuf Gaming</h1>
<p>أفضل مكتبة ألعاب للأندرويد و ROMS</p>
</header>

<!-- 🔥 الصفحة الرئيسية -->
<section class="games" id="main">

<!-- Android -->
<div class="card" onclick="showSection('android')">
<img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
<div class="card-content">
<h2>Android</h2>
<button class="game-btn">دخول</button>
</div>
</div>

<!-- ROMS -->
<div class="card" onclick="showSection('roms')">
<img src="https://media.sketchfab.com/models/266d26be2a6d47d58880bb723d1faf7a/thumbnails/67943311943141aab921e5f9a1916ae4/53435a17ae3242e9b07b89c417472d88.jpeg">
<div class="card-content">
<h2>ROMS</h2>
<button class="game-btn">دخول</button>
</div>
</div>

</section>

<!-- 🎮 Android -->
<section id="android" class="games hidden">

<button class="back-btn" onclick="goBack()">⬅ رجوع</button>

<div class="card" onclick="openGrayland()">
<img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/297190/capsule_616x353.jpg">
<div class="card-content">
<h2>Grayland</h2>
<p>لعبة مغامرات وألغاز بأجواء مظلمة</p>
</div>
</div>

</section>

<!-- 🎮 ROMS -->
<section id="roms" class="games hidden">

<button class="back-btn" onclick="goBack()">⬅ رجوع</button>

<!-- NES -->
<div class="card">
<img src="https://cdn.shopify.com/s/files/1/0336/4824/6924/collections/1760169.png?v=1597423331">
<div class="card-content"><h2>NES</h2></div>
</div>

<!-- SNES -->
<div class="card">
<img src="https://bitjumpgames.com/cdn/shop/files/snes_logo.png?v=1736747784&width=460">
<div class="card-content"><h2>SNES</h2></div>
</div>

<!-- Sega Genesis -->
<div class="card">
<img src="https://i.ytimg.com/vi/nOaew78FV54/maxresdefault.jpg">
<div class="card-content"><h2>Sega Genesis</h2></div>
</div>

<!-- PSP -->
<div class="card">
<img src="https://pbs.twimg.com/media/F4OTmp9XgAAB0lj.jpg">
<div class="card-content"><h2>PSP</h2></div>
</div>

</section>

<script>

function showSection(id){

    document.getElementById("main").style.display="none";

    document.querySelectorAll(".hidden").forEach(s=>{
        s.style.display="none";
    });

    document.getElementById(id).style.display="grid";
}

function goBack(){

    document.querySelectorAll(".hidden").forEach(s=>{
        s.style.display="none";
    });

    document.getElementById("main").style.display="grid";
}

function openGrayland(){
    window.location.href = "grayland.html";
}

</script>

</body>
</html>
