<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background: radial-gradient(circle at top, #1a1f3a, #0b0d12 60%);
  color:white;
}

header{
  padding:16px;
  font-size:20px;
  text-align:center;
  font-weight:bold;
  background: linear-gradient(90deg,#5865f2,#7c4dff);
  box-shadow:0 0 20px rgba(88,101,242,0.4);
}

.tabs{
  padding:12px;
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}

button{
  padding:8px 16px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  background:#1e2235;
  color:#bbb;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 10px rgba(88,101,242,0.4);
}

button.active{
  background:linear-gradient(90deg,#5865f2,#7c4dff);
  color:#fff;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;
  padding:16px;
}

.card{
  background:#141827;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
  border:1px solid rgba(255,255,255,0.05);
}

.card:hover{
  transform:translateY(-6px) scale(1.02);
  box-shadow:0 0 20px rgba(88,101,242,0.25);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
  display:block;
  filter:brightness(0.9);
}

.card-content{
  padding:10px;
  font-size:13px;
  color:#ddd;
  text-align:center;
}

.hide{
  display:none !important;
}

footer{
  margin-top:20px;
  padding:15px;
  text-align:center;
  font-size:12px;
  color:#aaa;
  border-top:1px solid rgba(255,255,255,0.08);
  background:#0b0d12;
}
</style>
</head>

<body>

<header>🎮 Yesuf Gaming</header>

<div class="tabs">
  <button class="active" onclick="filter('all',this)">الكل</button>
  <button onclick="filter('android',this)">Android</button>
  <button onclick="filter('pc',this)">PC</button>
</div>

<div class="cards" id="main-cards">

  <div class="card" data-type="android">
    <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
    <div class="card-content">Android Games</div>
  </div>

  <div class="card" data-type="pc">
    <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
    <div class="card-content">PC Games</div>
  </div>

  <div class="card" onclick="openRoms()">
    <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg">
    <div class="card-content">ROMS</div>
  </div>

</div>

<!-- ROMS بدون زر رجوع -->
<div class="cards hide" id="roms-cards">

  <div class="card">
    <img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
    <div class="card-content">Nintendo Switch (NSW)</div>
  </div>

</div>

<footer>
  جميع الحقوق محفوظة © 2026 Yesuf Gaming
</footer>

<script>

function openRoms() {
  document.getElementById('main-cards').classList.add('hide');
  document.getElementById('roms-cards').classList.remove('hide');
  history.pushState({ page: "roms" }, "");
}

function closeRoms() {
  document.getElementById('roms-cards').classList.add('hide');
  document.getElementById('main-cards').classList.remove('hide');
  history.pushState({ page: "home" }, "");
}

window.addEventListener("popstate", function (event) {
  document.getElementById('roms-cards').classList.add('hide');
  document.getElementById('main-cards').classList.remove('hide');
});

function filter(type, btn) {

  document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('roms-cards').classList.add('hide');
  document.getElementById('main-cards').classList.remove('hide');

  document.querySelectorAll('#main-cards .card').forEach(card => {
    let t = card.getAttribute('data-type');
    if (!t) return;
    card.classList.toggle('hide', type !== 'all' && t !== type);
  });

  history.pushState({ page: "home" }, "");
}

</script>

</body>
</html>
