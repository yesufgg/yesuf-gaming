<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<style>

body{
  margin:0;
  font-family:Arial;
  background:#050508;
  color:white;
}

/* 🔥 الهيدر */
header{
  text-align:center;
  padding:80px 20px;
  background: radial-gradient(circle at top, #7c3aed, #050508);
}

header h1{
  font-size:50px;
  margin:0;
}

header p{
  opacity:0.8;
  font-size:18px;
}

/* 🔍 البحث */
.section-title{
  text-align:center;
  font-size:22px;
  margin-top:20px;
  color:#06b6d4;
}

.search-box{
  text-align:center;
  margin:15px 0 20px;
}

.search-box input{
  width:85%;
  max-width:500px;
  padding:14px;
  border-radius:14px;
  border:none;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.05);
  color:white;
  border:1px solid rgba(255,255,255,0.1);
}

/* 🎯 الفلاتر */
.filters{
  text-align:center;
  margin:10px 0 30px;
}

.filters button{
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  background:#1a1a1a;
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.filters button:hover{
  background:#7c3aed;
}

/* 🎮 الألعاب */
.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  padding:30px;
  max-width:1100px;
  margin:auto;
}

/* 🎴 الكرت */
.card{
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:18px;
  overflow:hidden;
  transition:0.3s;
  backdrop-filter: blur(10px);
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 15px 40px rgba(124,58,237,0.4);
}

/* 🖼️ الصور */
.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

/* 📝 العنوان */
.card h2{
  text-align:center;
  margin:15px 0;
}

/* 🔘 الأزرار */
button.game-btn,
.emu-btn{
  width:90%;
  margin:15px auto;
  display:block;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  color:white;
  font-size:15px;
  cursor:pointer;
  transition:0.3s;
}

button.game-btn:hover,
.emu-btn:hover{
  transform:scale(1.05);
}

/* 📌 الفوتر */
footer{
  text-align:center;
  padding:25px;
  color:#777;
  margin-top:30px;
}

</style>

</head>

<body>

<header>
<h1>🎮 Yesuf Gaming</h1>
<p>مكتبة الألعاب الأفضل للأندرويد والبيسي</p>
</header>

<!-- 🔍 البحث -->
<h2 class="section-title">🔍 البحث</h2>

<div class="search-box">
<input type="text" id="searchInput" onkeyup="searchGames()" placeholder="ابحث عن لعبة...">
</div>

<!-- 🎯 الفلاتر -->
<div class="filters">

<button onclick="filterGames('all')">الكل</button>
<button onclick="filterGames('android')">أندرويد</button>
<button onclick="filterGames('pc')">PC</button>
<button onclick="filterGames('online')">أونلاين</button>

</div>

<!-- 🕹️ زر ROMS -->
<button class="emu-btn" onclick="toggleEmulators()">
🕹️ ألعاب المحاكيات ROMS
</button>

<!-- 🎮 الألعاب -->
<h2 class="section-title">🎮 الألعاب</h2>

<section class="games">

<div class="card" data-category="android">

  <!-- 🔥 ضع رابط صورة اللعبة هنا -->
  <img src="https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/297190/capsule_616x353.jpg?t=1700734056">

  <h2>Grayland</h2>

  <a href="grayland.html">
    <button class="game-btn">📖 التفاصيل</button>
  </a>

</div>

</section>

<!-- 🕹️ قسم ROMS -->
<div id="emulatorsSection" style="display:none;">

<h2 class="section-title">🕹️ ألعاب المحاكيات ROMS</h2>

<section class="games">

<!-- 🎮 PS2 -->
<div class="card">

  <!-- 🔥 ضع رابط صورة الجهاز هنا -->
  <img src="https://media.sketchfab.com/models/266d26be2a6d47d58880bb723d1faf7a/thumbnails/67943311943141aab921e5f9a1916ae4/53435a17ae3242e9b07b89c417472d88.jpeg">

  <h2>PlayStation 2</h2>

  <button class="game-btn">
    عرض الألعاب
  </button>

</div>

<!-- 🎮 PSP -->
<div class="card">

  <img src="https://upload.wikimedia.org/wikipedia/commons/c/c9/PSP-1000.jpg">

  <h2>PlayStation Portable</h2>

  <button class="game-btn">
    عرض الألعاب
  </button>

</div>

<!-- 🎮 Nintendo Switch -->
<div class="card">

  <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/NintendoSwitchLogo.png">

  <h2>Nintendo Switch</h2>

  <button class="game-btn">
    عرض الألعاب
  </button>

</div>

</section>

</div>

<footer>
© 2026 YESUF Gaming
</footer>

<script>

/* 🔍 البحث */
function searchGames(){

  let input = document.getElementById("searchInput").value.toLowerCase();

  let cards = document.getElementsByClassName("card");

  for(let i = 0; i < cards.length; i++){

    let title = cards[i].getElementsByTagName("h2")[0];

    if(title.innerText.toLowerCase().includes(input)){
      cards[i].style.display = "block";
    }
    else{
      cards[i].style.display = "none";
    }

  }
}

/* 🎯 الفلترة */
function filterGames(category){

  let cards = document.getElementsByClassName("card");

  for(let i = 0; i < cards.length; i++){

    let cat = cards[i].getAttribute("data-category");

    if(category === "all"){
      cards[i].style.display = "block";
    }
    else if(cat === category){
      cards[i].style.display = "block";
    }
    else{
      cards[i].style.display = "none";
    }

  }
}

/* 🕹️ إظهار وإخفاء قسم ROMS */
function toggleEmulators(){

  let section = document.getElementById("emulatorsSection");

  if(section.style.display === "none"){

    section.style.display = "block";

    section.scrollIntoView({
      behavior:"smooth"
    });

  }
  else{

    section.style.display = "none";

  }
}

</script>

</body>
</html>
