<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0d12;
  color:white;
}

header{
  padding:12px;
  background:#00000080;
  position:sticky;
  top:0;
}

/* cards */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  padding:16px;
}

.card{
  background:#171a22;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.03);
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.hide{
  display:none;
}

/* buttons */
button{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<header>
  🎮 Yesuf Gaming
</header>

<!-- FILTER BUTTONS -->
<div style="padding:10px;">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('android')">Android</button>
  <button onclick="filter('pc')">PC</button>
  <button onclick="filter('roms')">ROMS</button>
</div>

<!-- CARDS -->
<div class="cards">

  <!-- ANDROID -->
  <div class="card" data-type="android">
    <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
    <div class="card-content">
      Android Games
    </div>
  </div>

  <!-- PC -->
  <div class="card" data-type="pc">
    <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
    <div class="card-content">
      PC Games
    </div>
  </div>

  <!-- ROMS -->
  <div class="card" data-type="roms">
    <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg?w=1600&h=900&fit=crop">
    <div class="card-content">
      ROMS
    </div>
  </div>

  <!-- NSW (تابع ROMS) -->
  <div class="card" data-type="roms">
    <img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
    <div class="card-content">
      Nintendo Switch (NSW)
    </div>
  </div>

</div>

<script>
function filter(type){

  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {

    let t = card.getAttribute("data-type");

    if(type === "all"){
      card.classList.remove("hide");
    }
    else{
      if(t === type){
        card.classList.remove("hide");
      } else {
        card.classList.add("hide");
      }
    }

  });

}
</script>

</body>
</html>
