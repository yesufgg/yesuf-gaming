```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cairo',sans-serif;
    background:#07111d;
    color:white;
    overflow-x:hidden;
}

/* 🔥 خلفية احترافية */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at top,#1d4ed8 0%,transparent 40%),
    radial-gradient(circle at bottom,#7c3aed 0%,transparent 35%);
    opacity:0.25;
    z-index:-1;
}

/* 🔥 الهيدر */
header{
    text-align:center;
    padding:80px 20px 50px;
}

header h1{
    font-size:60px;
    font-weight:800;
    background:linear-gradient(90deg,#60a5fa,#a855f7);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

header p{
    margin-top:10px;
    color:#cbd5e1;
    font-size:20px;
}

/* 🎮 الأقسام */
.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
    padding:30px;
    max-width:1300px;
    margin:auto;
}

/* 🎴 الكروت */
.card{
    position:relative;
    border-radius:24px;
    overflow:hidden;
    cursor:pointer;
    background:#111827;
    transition:0.4s;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
    box-shadow:0 20px 60px rgba(96,165,250,0.25);
}

.card img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
}

.overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,0.92),transparent);
}

.card-content{
    position:absolute;
    bottom:0;
    width:100%;
    padding:20px;
}

.card-content h2{
    font-size:30px;
    margin-bottom:5px;
}

.card-content p{
    color:#d1d5db;
    font-size:16px;
}

/* 🔙 زر الرجوع */
.back-btn{
    margin:25px;
    padding:12px 18px;
    border:none;
    border-radius:14px;
    background:#111827;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
    font-family:'Cairo',sans-serif;
}

.back-btn:hover{
    background:#2563eb;
}

/* 🔥 إخفاء */
.hidden{
    display:none;
}

/* 🔥 الفوتر */
footer{
    text-align:center;
    padding:30px 15px;
    margin-top:60px;
    color:#94a3b8;
    font-size:15px;
    border-top:1px solid rgba(255,255,255,0.08);
    background:#0b1220;
}

/* 📱 الهاتف */
@media(max-width:768px){

    header{
        padding:60px 15px 35px;
    }

    header h1{
        font-size:40px;
    }

    header p{
        font-size:16px;
    }

    .games{
        grid-template-columns:1fr;
        gap:20px;
        padding:20px;
    }

    .card img{
        height:210px;
    }

    .card-content h2{
        font-size:24px;
    }

    .card-content p{
        font-size:14px;
    }

}

</style>
</head>

<body>

<!-- 🔥 الهيدر -->
<header>
<h1>🎮 Yesuf Gaming</h1>
<p>🔥 ألعاب مميزة قد لا تجدها في مكان آخر 🎮📱💻</p>
</header>

<!-- 🔥 الصفحة الرئيسية -->
<section class="games" id="main">

<div class="card" onclick="showSection('roms')">

<img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg?w=1600&h=900&fit=crop">

<div class="overlay"></div>

<div class="card-content">
<h2>ROMS</h2>
<p>🎮 مكتبة الألعاب</p>
</div>

</div>

</section>

<!-- 🎮 قسم ROMS -->
<section class="games hidden" id="roms">

<button class="back-btn" onclick="goBack()">⬅ رجوع</button>

<div class="card">

<img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">

<div class="overlay"></div>

<div class="card-content">
<h2>Nintendo Switch</h2>
</div>

</div>

</section>

<!-- 🔥 الفوتر -->
<footer>
© 2026 Yesuf Gaming — كل الحقوق محفوظة 🎮
</footer>

<script>

/* 🔥 فتح الأقسام */
function showSection(id){

    document.querySelectorAll("section").forEach(section=>{
        section.style.display="none";
    });

    document.getElementById(id).style.display="grid";

    history.pushState({page:id},"","#"+id);
}

/* 🔙 الرجوع */
function goBack(){

    document.querySelectorAll("section").forEach(section=>{
        section.style.display="none";
    });

    document.getElementById("main").style.display="grid";

    history.pushState({}, "", " ");
}

/* 📱 دعم زر الرجوع */
window.addEventListener("popstate",function(event){

    document.querySelectorAll("section").forEach(section=>{
        section.style.display="none";
    });

    if(event.state && event.state.page){

        document.getElementById(event.state.page).style.display="grid";

    }else{

        document.getElementById("main").style.display="grid";
    }

});

/* 🔥 أول تشغيل */
document.getElementById("main").style.display="grid";

</script>

</body>
</html>
```
