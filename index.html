<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  background:#0b0d12;
  color:white;
}

/* ===== HEADER ===== */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  position:sticky;
  top:0;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(12px);
}

.logo{
  font-weight:bold;
  font-size:16px;
}

.subtitle{
  font-size:11px;
  opacity:0.7;
}

.search{
  padding:8px;
  border:none;
  border-radius:8px;
  outline:none;
  width:160px;
}

/* ===== CARDS ===== */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  padding:16px;
}

.card{
  background:#171a22;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:0.25s;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
}

.card:hover{
  transform:translateY(-6px) scale(1.02);
}

.card img{
  width:100%;
  height:110px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.card-title{
  font-size:14px;
  font-weight:bold;
}

.card-desc{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header>
  <div>
    <div class="logo">🎮 Yesuf Gaming</div>
    <div class="subtitle">ألعاب PC + Android + ROMS</div>
  </div>

  <input class="search" placeholder="بحث...">
</header>

<!-- ===== ALL CARDS (VISIBLE DIRECTLY) ===== -->
<div class="cards">

  <!-- ANDROID -->
  <div class="card">
    <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
    <div class="card-content">
      <div class="card-title">Android Games</div>
      <div class="card-desc">ألعاب أندرويد</div>
    </div>
  </div>

  <!-- PC -->
  <div class="card">
    <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
    <div class="card-content">
      <div class="card-title">PC Games</div>
      <div class="card-desc">ألعاب الكمبيوتر</div>
    </div>
  </div>

  <!-- ROMS (NEW IMAGE) -->
  <div class="card">
    <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg?w=1600&h=900&fit=crop">
    <div class="card-content">
      <div class="card-title">ROMS</div>
      <div class="card-desc">ألعاب الأجهزة و المحاكيات</div>
    </div>
  </div>

</div>

</body>
</html>
