<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Yesuf Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Tajawal',sans-serif;
}

body{

background:#090b13;
color:#fff;
overflow-x:hidden;

}

/* Header */

header{

height:90px;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
font-weight:900;
letter-spacing:2px;
background:linear-gradient(90deg,#005eff,#00bfff);
box-shadow:0 5px 20px rgba(0,0,0,.4);

}

/* Container */

.container{

width:95%;
max-width:1200px;
margin:auto;
padding:40px 0;

}

/* Title */

.title{

text-align:center;
font-size:20px;
margin-bottom:35px;
color:#cfd8ff;

}

/* Cards */

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:35px;

}

/* Card */

.card{

background:#121826;
border-radius:22px;
overflow:hidden;
cursor:pointer;
transition:.35s;
border:2px solid transparent;

}

.card:hover{

transform:translateY(-8px);
border-color:#2f81ff;
box-shadow:0 0 35px rgba(47,129,255,.35);

}

.card img{

width:100%;
height:240px;
object-fit:cover;
display:block;

}

.content{

padding:22px;
text-align:center;

}

.content h2{

font-size:28px;
margin-bottom:8px;

}

.content p{

font-size:16px;
color:#bfc7d9;

}

/* Footer */

footer{

margin-top:60px;
padding:25px;
text-align:center;
background:#101624;
color:#8f98ad;

}

/* Responsive */

@media(max-width:700px){

header{

font-size:28px;

}

.card img{

height:200px;

}

.content h2{

font-size:24px;

}

}

</style>

</head>

<body>

<header>

YESUF GAMING

</header>

<div class="container">

<div class="title">

Android & PC Games Library

</div>

<div class="cards">

<div class="card" onclick="location.href='android.html'">

<img src="https://miro.medium.com/1*XIX50Fdd6vJbIng_n2U5Pw.png">

<div class="content">

<h2>Android Games</h2>

<p>Download the best Android games.</p>

</div>

</div>

<div class="card" onclick="location.href='pc.html'">

<img src="https://img.goodfon.com/wallpaper/nbig/2/95/microfoft-windows-10-windows-logo.webp">

<div class="content">

<h2>PC Games</h2>

<p>Download the best PC games.</p>

</div>

</div>

</div>
<footer>

© 2026 YESUF GAMING - All Rights Reserved

</footer>

</div>

<script>

// تأثير بسيط عند تحميل الصفحة
window.addEventListener("load", () => {

    document.querySelectorAll(".card").forEach((card, index) => {

        card.style.opacity = "0";
        card.style.transform = "translateY(40px)";

        setTimeout(() => {
            card.style.transition = ".6s";
            card.style.opacity = "1";
            card.style.transform = "translateY(0)";
        }, index * 200);

    });

});

// فتح الصفحة عند الضغط
function openPage(page){
    window.location.href = page;
}

</script>

</body>
</html>
