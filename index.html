<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yesuf Gaming</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Tajawal', Arial;
  background: radial-gradient(circle at top, #141a33, #0b0d12 70%);
  color:white;
  overflow-x:hidden;
}

/* هيدر */
header{
  padding:20px;
  text-align:center;
  font-size:26px;
  font-weight:900;
  background: linear-gradient(90deg,#5865f2,#7c4dff,#00d4ff);
}

/* كروت */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:25px;
}

/* كرت */
.card{
  background:#141827;
  border-radius:18px;
  overflow:hidden;
  cursor:pointer;
  transition:0.3s;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.card:hover{
  transform:translateY(-10px) scale(1.05);
  box-shadow:0 0 35px rgba(88,101,242,0.5);
}

.card img{
  width:100%;
  height:170px;
  object-fit:cover;
}

.card-content{
  padding:14px;
  text-align:center;
  font-size:17px;
  font-weight:800;
}

/* الصفحات */
.page{
  display:none;
}

.active{
  display:block;
}

/* GTA CARD خاص */
.gta-card img{
  height:200px;
}
</style>
</head>

<body>

<header>🎮 YESUF GAMING</header>

<!-- HOME -->
<div id="home" class="page active">

  <div class="cards">

    <div class="card" onclick="openPage('android')">
      <img src="https://storage.googleapis.com/gweb-uniblog-publish-prod/images/HeroHomepage_2880x1200.width-1300_oirLRAu.jpg">
      <div class="card-content">Android Games</div>
    </div>

    <div class="card" onclick="openPage('pc')">
      <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
      <div class="card-content">PC Games</div>
    </div>

    <div class="card" onclick="openPage('roms')">
      <img src="https://static0.howtogeekimages.com/wordpress/wp-content/uploads/2024/04/shutterstock_1290635251.jpg">
      <div class="card-content">ROMS</div>
    </div>

  </div>

</div>

<!-- ANDROID -->
<div id="android" class="page">
  <div class="cards">

    <!-- GTA SA CARD -->
    <div class="card gta-card">
      <img src="https://s.yimg.com/ny/api/res/1.2/H2vlFwveKXLrIhuTP4RPfw--/YXBwaWQ9aGlnaGxhbmRlcjt3PTEyMDA7aD03NTA7Y2Y9d2VicA--/https://media.zenfs.com/en-US/homerun/gamespot.cbs.com/c8adc9e563ae54930b48cb12f171070c">
      <div class="card-content">GTA San Andreas</div>
    </div>

  </div>
</div>

<!-- PC -->
<div id="pc" class="page">
  <div class="cards">
    <div class="card">
      <img src="https://rubee.com.vn/admin/webroot/upload/image//images/tin-tuc/window-logo-2.jpg">
      <div class="card-content">PC Games</div>
    </div>
  </div>
</div>

<!-- ROMS -->
<div id="roms" class="page">
  <div class="cards">

    <div class="card" onclick="openPage('nsw')">
      <img src="https://pixelz.cc/wp-content/uploads/2019/08/nintendo-switch-logo-blue-and-red-uhd-4k-wallpaper.jpg">
      <div class="card-content">Nintendo Switch (NSW)</div>
    </div>

  </div>
</div>

<!-- NSW -->
<div id="nsw" class="page">
  <div class="cards">

    <div class="card" onclick="openZelda()">
      <img src="https://assets.nintendo.com/image/upload/c_limit,f_auto,h_300,q_auto,w_400/v1/Microsites/zelda-tears-of-the-kingdom/videos/posters/totk_microsite_officialtrailer2_fr">
      <div class="card-content">The Legend Of Zelda TOTK</div>
    </div>

  </div>
</div>

<script>

function openPage(page){
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.remove('active');
  });

  document.getElementById(page).classList.add('active');
  history.pushState({page:page}, "", "#" + page);
}

function openZelda(){
  window.location.href = "zelda.html";
}

window.onpopstate = function(event){

  if(event.state && event.state.page){

    document.querySelectorAll('.page').forEach(p=>{
      p.classList.remove('active');
    });

    document.getElementById(event.state.page).classList.add('active');

  } else {
    openPage("home");
  }
};

</script>

</body>
</html>
